name: Build (manual)

# THE ONE coordinated build workflow (Hot Attic Games master standard sections 5-9; docs/RELEASES.md). Trigger: workflow_dispatch ONLY. Nothing else (a push, a
# pull request, a merge, a tag, a branch name, a test run) can start it, build with it or publish with it. Validation of pushes and pull requests is tests.yml;
# publishing an OTA is ota-publish.yml (a separate, owner-authorised mechanism); this file builds and, only on request, publishes a numbered release.
# (The file keeps the name ci.yml because GitHub can dispatch only workflows it has already registered, and the engine pin below is read from this path by
# tools/ota_runtime.py.)
#
#   platform     android | windows | linux | all
#   source_sha   the exact 40-character commit to build
#   build_number the coordinated build number (Purgatory Dungeon Build NN): above every consumed number, never reused
#   destination  local_only (default): artifacts stay private to this Actions run, nothing is tagged, released, uploaded or published
#                github_releases: ALSO publishes "Purgatory Dungeon Build NN" (tag build-NN) with the five standard files; platform=all only; the separate
#                `publish` job, the only job that can write a release, after re-validating the source, the number, the actor's repository role and the
#                integrity of the artifact set
#
# Standard files: Purgatory Dungeon Build NN APK.apk / EXE.zip / Linux.tar.gz, build-manifest.json, checksums.sha256 (tools/build.py, tools/build_gate.py).
# Every platform is built from the SAME commit with the SAME number; an incomplete, altered or mixed set is rejected by `assemble`. Releases v1-v8 and their
# tags are history and are never touched. Cost: one hosted run builds what it was asked to (docs/RELEASES.md "CI cost").
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, windows, linux, all]
        default: all
      source_sha:
        description: Exact 40-character commit SHA to build (must be on the authoritative line)
        type: string
        required: true
      build_number:
        description: Coordinated build number (positive integer, above every consumed number)
        type: string
        required: true
      destination:
        description: local_only keeps artifacts private to this run; github_releases also publishes (platform=all only, admin or maintain only)
        type: choice
        options: [local_only, github_releases]
        default: local_only

# Two dispatches for the same number never run at once and a started build is never cancelled half way.
concurrency:
  group: build-${{ inputs.build_number }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.6"
  GODOT_RELEASE: "4.6-stable"
  # The exact commit being built (validated by the gate before anything uses it).
  SOURCE_SHA: ${{ inputs.source_sha }}
  BUILD_NUMBER: ${{ inputs.build_number }}

# Read-only by default; the two jobs that need more say why.
permissions:
  contents: read

jobs:
  # ── 1. Gate: inputs, source authority and provenance, build-number uniqueness. Runs the TRUSTED tools of the workflow commit against the source. ──
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      android: ${{ steps.plan.outputs.android }}
      windows: ${{ steps.plan.outputs.windows }}
      linux: ${{ steps.plan.outputs.linux }}
    steps:
      - name: Workflow commit (trusted tools and trusted authority file)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the inputs
        env:
          IN_PLATFORM: ${{ inputs.platform }}
          IN_SHA: ${{ inputs.source_sha }}
          IN_NUMBER: ${{ inputs.build_number }}
          IN_DESTINATION: ${{ inputs.destination }}
        run: python3 tools/build_gate.py inputs --platform "$IN_PLATFORM" --source-sha "$IN_SHA" --build-number "$IN_NUMBER" --destination "$IN_DESTINATION"

      - name: Source commit (the exact commit, every branch and tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: src
          fetch-depth: 0

      - name: Source authority and provenance (on the authoritative line, workflow commit too, descends from every release)
        run: python3 tools/build_gate.py source --sha "$SOURCE_SHA" --workflow-sha "$GITHUB_SHA" --authority-root . --repo src

      - name: Build number (not consumed by any tag or release, above every consumed number)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].name' > release-names.txt
          python3 tools/build_gate.py number --build-number "$BUILD_NUMBER" --release-names release-names.txt --repo src

      - name: Plan
        id: plan
        env:
          IN_PLATFORM: ${{ inputs.platform }}
        run: |
          want() { if [[ "$IN_PLATFORM" == "all" || "$IN_PLATFORM" == "$1" ]]; then echo true; else echo false; fi; }
          echo "android=$(want android)" >> "$GITHUB_OUTPUT"
          echo "windows=$(want windows)" >> "$GITHUB_OUTPUT"
          echo "linux=$(want linux)" >> "$GITHUB_OUTPUT"

  # ── 2. The full validation suite on the exact source commit. Nothing is built or signed until it is green. ──
  validate:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45   # typical: 15-17 minutes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_RELEASE }}-editor-v1

      - name: Install Godot ${{ env.GODOT_RELEASE }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -O "${base}/SHA512-SUMS.txt"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          grep -E "Godot_v${GODOT_RELEASE}_linux.x86_64.zip$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          rm -f *.zip

      - name: Locate Godot
        run: echo "GODOT=$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify Godot version
        run: |
          "$GODOT" --version
          "$GODOT" --version | grep -q "^${GODOT_VERSION}.stable"

      - name: Check public version consistency
        run: python3 tools/release_tool.py check

      - name: Native runtime lock (docs/OTA.md section 3)
        run: python3 tools/ota_runtime.py --check

      - name: Validate project and run tests
        env:
          REQUIRE_STUDIO_LOGO: "1"   # a numbered build must contain the canonical studio logo
          TEST_JOBS: ${{ vars.CI_TEST_JOBS }}
        run: tests/run_tests.sh "$GODOT"

      - name: Exact-tree check (is the tested tree the tree of the commit named SOURCE_SHA?)
        id: exacttree
        run: |
          same=false
          if python3 tools/ota/proven_suite.py same-tree --sha "$SOURCE_SHA"; then same=true; fi
          echo "same=$same" >> "$GITHUB_OUTPUT"

      - name: Exact-SHA attestation (the suite above passed on the tree of the commit)
        if: steps.exacttree.outputs.same == 'true'
        run: echo "the full suite passed on the exact tree of commit $SOURCE_SHA"

  # ── 3a. Windows ──
  windows:
    needs: [gate, validate]
    if: ${{ needs.gate.outputs.windows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Cache Godot editor + Windows export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-windows-templates-v1

      - name: Install Godot ${{ env.GODOT_RELEASE }} + Windows templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -O "${base}/SHA512-SUMS.txt"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          grep -E "Godot_v${GODOT_RELEASE}_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" 'templates/windows_*' 'templates/version.txt' -d tmp
          mv tmp/templates/* "$tpl"/
          rm -rf tmp *.zip *.tpz

      - name: Locate Godot
        run: echo "GODOT=$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Build, verify and package Windows from the exact commit
        run: python3 tools/build.py --platform windows --godot "$GODOT" --source-sha "$SOURCE_SHA" --build-number "$BUILD_NUMBER" --naming standard --out dist/windows

      - name: Upload Windows part (private to this run)
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/windows
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ── 3b. Linux (native x86-64) ──
  linux:
    needs: [gate, validate]
    if: ${{ needs.gate.outputs.linux == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Cache Godot editor + Linux export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-linux-templates-v1

      - name: Install Godot ${{ env.GODOT_RELEASE }} + Linux templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -O "${base}/SHA512-SUMS.txt"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          grep -E "Godot_v${GODOT_RELEASE}_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" 'templates/linux_*' 'templates/version.txt' -d tmp
          mv tmp/templates/* "$tpl"/
          rm -rf tmp *.zip *.tpz

      - name: Locate Godot
        run: echo "GODOT=$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Build, verify and package Linux from the exact commit
        run: python3 tools/build.py --platform linux --godot "$GODOT" --source-sha "$SOURCE_SHA" --build-number "$BUILD_NUMBER" --naming standard --out dist/linux

      - name: Upload Linux part (private to this run)
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/linux
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ── 3c. Android: built, signed with the EXISTING app key and qualified. The key is only ever read; a missing key fails the job. ──
  android:
    needs: [gate, validate]
    if: ${{ needs.gate.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: android-signing-key
      cancel-in-progress: false
    permissions:
      contents: write   # ONLY to read the private draft release that stores the signing key (drafts are invisible to a read-only token); tools/android/signing.sh
                        # is told ANDROID_REQUIRE_EXISTING_KEY=1 below, so it can neither generate a key nor create a release in this workflow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot editor + Android export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-android-templates-v1

      - name: Install Godot ${{ env.GODOT_RELEASE }} + Android templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -O "${base}/SHA512-SUMS.txt"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          grep -E "Godot_v${GODOT_RELEASE}_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" 'templates/android_*' 'templates/version.txt' -d tmp
          mv tmp/templates/* "$tpl"/
          rm -rf tmp *.zip *.tpz

      - name: Locate Godot
        run: echo "GODOT=$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify Godot version
        run: |
          "$GODOT" --version
          "$GODOT" --version | grep -q "^${GODOT_VERSION}.stable"

      - name: Native runtime lock (docs/OTA.md section 3)
        run: python3 tools/ota_runtime.py --check

      - name: Write build_info.json (shipped inside the game; carries the commit, the build number and the native runtime identity)
        run: python3 tools/release_tool.py build-info build_info.json --commit "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --ref "$GITHUB_REF" --platform android --engine "$GODOT_RELEASE" --build-number "$BUILD_NUMBER"

      - name: Android signing key (existing key only)
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_REQUIRE_EXISTING_KEY: "1"
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: source tools/android/signing.sh

      - name: Build and qualify the APK
        run: tools/android/build_apk.sh "$GODOT" build/android/Purgatory-Dungeon-Android.apk

      - name: Qualify the APK for this build number (identity, version code, signing identity, runtime identity, content)
        run: |
          python3 tools/verify_apk.py build/android/Purgatory-Dungeon-Android.apk --version "$(cat VERSION)" --build-number "$BUILD_NUMBER" \
            --require-logo --sha "$SOURCE_SHA" --expect-cert "$ANDROID_CERT_SHA256" --require-permission android.permission.INTERNET

      - name: Package under the standard name with its manifest
        run: |
          rid="$(python3 -c "import json;print(json.load(open('build_info.json'))['runtime_id'])")"
          rfp="$(python3 -c "import json;print(json.load(open('build_info.json'))['runtime_fingerprint'])")"
          # the engine string every platform part records (tools/build.py: "4.6.stable"), so `assemble` can insist that all parts used one engine
          engine="$("$GODOT" --version | sed -E 's/^([0-9]+\.[0-9]+)\.([a-z]+).*/\1.\2/')"
          python3 tools/build_gate.py package --platform android --file build/android/Purgatory-Dungeon-Android.apk --out dist/android \
            --source-sha "$SOURCE_SHA" --build-number "$BUILD_NUMBER" --engine "$engine" \
            --detail "package=com.hotatticgames.purgatorydungeon" --detail "version_code=$(cat VERSION)" --detail "version_name=$(cat VERSION)" \
            --detail "cert_sha256=$ANDROID_CERT_SHA256" --detail "runtime_id=$rid" --detail "runtime_fingerprint=$rfp"

      - name: Upload Android part (private to this run)
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/android
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ── 4. Assemble: one coordinated set, or nothing. Rejects an incomplete, mixed, altered or unlisted set. ──
  assemble:
    needs: [gate, validate, windows, linux, android]
    # Every REQUESTED platform must have succeeded (a platform that was not requested is skipped); a failed or cancelled job ends the run here.
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.validate.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.windows.result) && contains(fromJSON('["success","skipped"]'), needs.linux.result) && contains(fromJSON('["success","skipped"]'), needs.android.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      manifest_sha256: ${{ steps.assemble.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - uses: actions/download-artifact@v4
        with:
          path: parts

      - name: Assemble and verify the coordinated set
        id: assemble
        env:
          IN_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 tools/build_gate.py assemble --in parts --out bundle --platform "$IN_PLATFORM" --source-sha "$SOURCE_SHA" --build-number "$BUILD_NUMBER"
          echo "manifest_sha256=$(sha256sum bundle/build-manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # The same facts in the job log (readable without downloading the artifact): sizes, SHA-256, source commit.
          echo "Source commit: ${SOURCE_SHA}"
          ls -l bundle
          cat bundle/checksums.sha256
          {
            echo "### Purgatory Dungeon Build ${BUILD_NUMBER} (${IN_PLATFORM}, local_only unless published below)"
            echo "Source commit \`${SOURCE_SHA}\`"
            echo
            echo '```'
            cat bundle/checksums.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the verified set (private to this run; not a release)
        uses: actions/upload-artifact@v4
        with:
          name: Purgatory-Dungeon-Build-${{ inputs.build_number }}
          path: bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ── 5. Publish: ONLY destination=github_releases. The only job that can write a release; it re-validates everything itself. ──
  publish:
    needs: [gate, assemble]
    if: ${{ inputs.destination == 'github_releases' && inputs.platform == 'all' && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-build-${{ inputs.build_number }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Workflow commit (trusted tools and trusted authority file)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actor authorisation (the repository role GitHub reports for the triggering actor; never an input)
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
          IN_DESTINATION: ${{ inputs.destination }}
          IN_PLATFORM: ${{ inputs.platform }}
        run: |
          role="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq '.role_name')"
          echo "actor ${ACTOR} has the repository role: ${role}"
          python3 tools/build_gate.py authorize --permission "$role" --destination "$IN_DESTINATION" --platform "$IN_PLATFORM"

      - name: Source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: src
          fetch-depth: 0

      - name: Re-validate source authority and build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/build_gate.py source --sha "$SOURCE_SHA" --workflow-sha "$GITHUB_SHA" --authority-root . --repo src
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].name' > release-names.txt
          python3 tools/build_gate.py number --build-number "$BUILD_NUMBER" --release-names release-names.txt --repo src

      - uses: actions/download-artifact@v4
        with:
          name: Purgatory-Dungeon-Build-${{ inputs.build_number }}
          path: bundle

      - name: Re-verify the artifact set (complete, one commit, one number, every checksum) and that it is the set `assemble` produced
        env:
          ASSEMBLED_MANIFEST_SHA256: ${{ needs.assemble.outputs.manifest_sha256 }}
        run: |
          python3 tools/build_gate.py verify --dir bundle --platform all --source-sha "$SOURCE_SHA" --build-number "$BUILD_NUMBER"
          test "$(sha256sum bundle/build-manifest.json | cut -d' ' -f1)" = "$ASSEMBLED_MANIFEST_SHA256"
          (cd bundle && sha256sum -c checksums.sha256)

      - name: Create the release "Purgatory Dungeon Build NN" (tag build-NN at the exact commit; refuses an existing tag or release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${BUILD_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "the tag or release ${tag} already exists: a build number is never reused"; exit 1
          fi
          {
            echo "**Purgatory Dungeon Build ${BUILD_NUMBER}**"
            echo
            echo "- \`Purgatory Dungeon Build ${BUILD_NUMBER} APK.apk\`: Android (arm64)"
            echo "- \`Purgatory Dungeon Build ${BUILD_NUMBER} EXE.zip\`: Windows (extract everything into one folder, run PurgatoryDungeon.exe)"
            echo "- \`Purgatory Dungeon Build ${BUILD_NUMBER} Linux.tar.gz\`: Linux x86-64, including Steam Deck and Steam Machine"
            echo "- \`build-manifest.json\` and \`checksums.sha256\`: provenance and SHA-256 of every file"
            echo
            echo "<details><summary>Technical details</summary>"
            echo
            echo "Source commit: \`${SOURCE_SHA}\`. Built by workflow run ${GITHUB_RUN_ID}. All three platforms come from this one commit."
            echo "</details>"
          } > release-notes.md
          # Asset display labels keep the spaces of the standard names (GitHub turns spaces in file names into dots).
          args=()
          for f in bundle/*; do args+=("${f}#$(basename "$f")"); done
          gh release create "$tag" --target "$SOURCE_SHA" --title "Purgatory Dungeon Build ${BUILD_NUMBER}" --notes-file release-notes.md --latest "${args[@]}"
