name: CI

# Validate the project headlessly, then export a Windows build and upload it as a
# workflow artifact traceable to the exact commit.
#
# RELEASES (see docs/RELEASES.md): the owner only ever downloads "Purgatory Dungeon v<N>"
# from the GitHub Releases page.
#   * Push a tag v<N> (N = the number in ./VERSION), or - where tags cannot be pushed - the branch
#     release/v<N>: this workflow builds that exact commit and publishes the Release (title
#     "Purgatory Dungeon v<N>", file Purgatory-Dungeon-v<N>-Windows.zip, marked Latest). The build
#     is stamped as the release build, so the game shows plainly "Purgatory Dungeon v<N>".
#   * To publish a build an earlier CI run already made WITHOUT rebuilding it, push a
#     helper BRANCH  promote/v<N>/<run_id>/<full_sha>[/notlatest]  (created from a commit that
#     contains this workflow), wait for the `promote` job, then delete that helper branch.
#     (A branch push is used because workflow_dispatch only works for workflows on the default
#     branch, and the agent environment cannot push tags.)
on:
  push:
    branches: [main, 'promote/**', 'release/v[0-9]*', 'android-port']
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6"
  GODOT_RELEASE: "4.6-stable"
  # On pull_request events github.sha is a synthetic merge commit that exists on no
  # branch; record the real head commit so builds are traceable to checkable source.
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  validate-and-export:
    # A promote tag publishes an existing artifact; it must not rebuild anything. Pushes to the
    # android-port working branch build only the Android job (the full Windows run happens on the PR).
    if: ${{ !startsWith(github.ref, 'refs/heads/promote/') && github.ref != 'refs/heads/android-port' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-windows-templates-v1

      - name: Install Godot ${{ env.GODOT_RELEASE }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -O "${base}/SHA512-SUMS.txt"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          grep -E "Godot_v${GODOT_RELEASE}_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" 'templates/windows_*' 'templates/version.txt' -d tmp
          mv tmp/templates/* "$tpl"/
          rm -rf tmp *.zip *.tpz

      - name: Locate Godot
        run: echo "GODOT=$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify Godot version
        run: |
          "$GODOT" --version
          "$GODOT" --version | grep -q "^${GODOT_VERSION}.stable"

      - name: Check public version consistency
        run: |
          rel=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then rel="$GITHUB_REF_NAME"; fi
          if [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then rel="v${GITHUB_REF_NAME#release/v}"; fi
          if [[ -n "$rel" ]]; then
            python3 tools/release_tool.py check --tag "$rel"
          else
            python3 tools/release_tool.py check
          fi

      - name: Validate project and run tests
        env:
          # A release build must contain the canonical studio logo (docs/RELEASES.md).
          REQUIRE_STUDIO_LOGO: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')) && '1' || '' }}
        run: tests/run_tests.sh "$GODOT"

      - name: Write build_info.json (shipped inside the game)
        run: |
          rel=""
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/release/v* ]]; then rel="--release"; fi
          python3 tools/release_tool.py build-info build_info.json --commit "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" $rel

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          "$GODOT" --headless --path . --export-release "Windows Desktop" build/windows/PurgatoryDungeon.exe
          test -s build/windows/PurgatoryDungeon.exe
          test -s build/windows/PurgatoryDungeon.pck

      - name: Verify exported package
        run: |
          flags=""
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/release/v* ]]; then
            flags="--release --require-logo --sha $SOURCE_SHA"
          fi
          python3 tools/verify_package.py build/windows --version "$(cat VERSION)" $flags --godot "$GODOT"

      - name: Write build info
        run: |
          cd build/windows
          {
            echo "Purgatory Dungeon - Windows build"
            echo "source_sha=${SOURCE_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "godot=$("$GODOT" --version)"
            echo "built_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "export_preset=Windows Desktop (release, x86_64, external PCK)"
            echo "sha256:"
            sha256sum PurgatoryDungeon.exe PurgatoryDungeon.pck
          } | tee BUILD_INFO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PurgatoryDungeon-windows-${{ env.SOURCE_SHA }}
          path: |
            build/windows/PurgatoryDungeon.exe
            build/windows/PurgatoryDungeon.pck
            build/windows/BUILD_INFO.txt
          retention-days: 7
          compression-level: 6

  # Android APK: built, signed with the stable app key and qualified (identity, API 36 target, 16 KB
  # alignment, signature, game content) by the same scripts anyone can run (tools/android/).
  android:
    if: ${{ !startsWith(github.ref, 'refs/heads/promote/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: android-signing-key      # first run creates the key; never two at once
      cancel-in-progress: false
    permissions:
      contents: write                 # stores the signing key in a private draft release on the first run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot editor + Android export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-android-templates-v1

      - name: Install Godot ${{ env.GODOT_RELEASE }} + Android templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -O "${base}/SHA512-SUMS.txt"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          grep -E "Godot_v${GODOT_RELEASE}_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" 'templates/android_*' 'templates/version.txt' -d tmp
          mv tmp/templates/* "$tpl"/
          rm -rf tmp *.zip *.tpz

      - name: Locate Godot
        run: echo "GODOT=$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify Godot version
        run: |
          "$GODOT" --version
          "$GODOT" --version | grep -q "^${GODOT_VERSION}.stable"

      - name: Check public version consistency
        run: |
          rel=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then rel="$GITHUB_REF_NAME"; fi
          if [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then rel="v${GITHUB_REF_NAME#release/v}"; fi
          if [[ -n "$rel" ]]; then python3 tools/release_tool.py check --tag "$rel"; else python3 tools/release_tool.py check; fi

      - name: Mobile input / splash / menu tests
        env:
          REQUIRE_STUDIO_LOGO: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')) && '1' || '' }}
          TEST_FILTER: touch_controls|mobile_ui|app_lifecycle|input_desktop|studio_splash|release_metadata|menu_scenes|misc_fixes|settings_controls|pause_options|pause_freeze|run_lifecycle|save_manager
        run: tests/run_tests.sh "$GODOT"

      - name: Write build_info.json (shipped inside the game)
        run: |
          rel=""
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/release/v* ]]; then rel="--release"; fi
          python3 tools/release_tool.py build-info build_info.json --commit "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" $rel

      - name: Android signing key
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: source tools/android/signing.sh

      - name: Build and qualify the APK
        run: tools/android/build_apk.sh "$GODOT" build/android/Purgatory-Dungeon-Android.apk

      - name: Android build record
        run: |
          apk=build/android/Purgatory-Dungeon-Android.apk
          {
            echo "Purgatory Dungeon - Android build"
            echo "source_sha=${SOURCE_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "godot=$("$GODOT" --version)"
            echo "package=com.hotatticgames.purgatorydungeon"
            echo "version_name=$(cat VERSION)"
            echo "version_code=$(cat VERSION)"
            echo "cert_sha256=${ANDROID_CERT_SHA256}"
            echo "apk_sha256=$(sha256sum "$apk" | cut -d' ' -f1)"
          } | tee build/android/ANDROID_BUILD_INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PurgatoryDungeon-android-${{ env.SOURCE_SHA }}
          path: |
            build/android/Purgatory-Dungeon-Android.apk
            build/android/ANDROID_BUILD_INFO.txt
          retention-days: 7
          compression-level: 0

  # Tag push or release/v<N> branch push -> publish the release built by this very run.
  publish:
    needs: [validate-and-export, android]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PurgatoryDungeon-windows-${{ env.SOURCE_SHA }}
          path: artifact
      - uses: actions/download-artifact@v4
        with:
          name: PurgatoryDungeon-android-${{ env.SOURCE_SHA }}
          path: android-artifact
      - name: Publish "Purgatory Dungeon v<N>" (Windows zip + Android APK)
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_ARTIFACT_DIR: android-artifact
        run: |
          ver="${GITHUB_REF_NAME#release/}"
          tools/publish_release.sh "${ver#v}" "$SOURCE_SHA" artifact "$GITHUB_RUN_ID" true

  # Helper branch promote/v<N>/<run_id>/<full_sha>[/notlatest] -> publish an artifact an earlier
  # run already built (no rebuild; the exact verified binary is attached).
  promote:
    if: startsWith(github.ref, 'refs/heads/promote/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Parse and validate the promote branch name
        id: p
        run: |
          IFS=/ read -r _ ver run sha flag <<<"$GITHUB_REF_NAME"
          [[ "$ver" =~ ^v[1-9][0-9]*$ ]] || { echo "bad version in branch name"; exit 1; }
          [[ "$run" =~ ^[0-9]+$ ]] || { echo "bad run id in branch name"; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha in branch name"; exit 1; }
          [[ -z "$flag" || "$flag" == "notlatest" ]] || { echo "bad flag in branch name"; exit 1; }
          echo "version=${ver#v}" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$flag" == "notlatest" ]]; then echo "latest=false" >> "$GITHUB_OUTPUT"; else echo "latest=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.p.outputs.run }}
          github-token: ${{ github.token }}
          pattern: PurgatoryDungeon-windows-*
          merge-multiple: true
          path: artifact
      - name: Publish "Purgatory Dungeon v<N>" from the existing artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/publish_release.sh "${{ steps.p.outputs.version }}" "${{ steps.p.outputs.sha }}" artifact "${{ steps.p.outputs.run }}" "${{ steps.p.outputs.latest }}"
