name: OTA

# Over-the-air update chain, CI side (docs/OTA.md). INFRASTRUCTURE ONLY: nothing here publishes anything unless the
# owner has configured the channel (see "Owner authorization boundary"). This workflow never creates, edits or
# deletes a GitHub Release, never creates a tag, never marks anything "Latest", and never touches a `vN` release
# (it only READS the shipped native build of vN to compare against; tests/test_ota_tools.py enforces this).
#
#   * every push (except promote/** and release/**, which ci.yml owns): job `ota-validate`
#       - OTA unit tests (tests/test_ota_tools.py, via tests/run_tests.sh with TEST_FILTER=ota)
#       - a full self-test of the chain (tools/ota/build_ota.sh --self-test: HEAD as its own base plus a synthetic
#         probe change, throwaway signing key) so the pipeline is proven without any published native build
#       - informational: what the current commit would be against the latest native tag (OTA-safe or APK required)
#   * push of a branch named  ota/v<N>/<K>  = the explicit publish action for "Purgatory Dungeon v<N> update <K>":
#       job `ota-publish` builds the real bundle for BOTH platforms against the native build of tag v<N>
#       (base.pck is compared with the shipped exe pck / APK), signs it, merges channel.json and verifies it.
#
# Owner authorization boundary (safe dry run by default): the bundle is only PUSHED to the channel when BOTH
#   OTA_CHANNEL_REPO  (repository variable or secret: "owner/repo" of the static channel host, e.g. a Pages repo)
#   OTA_PUBLISH_TOKEN (secret: token with contents:write on that repository only)
# exist. Otherwise the job uploads the bundle as a CI artifact and writes a summary saying publication is not
# configured. Signing key: Actions secret OTA_SIGNING_KEY_PEM_BASE64, else the private draft release "OTA signing key
# (do not delete)" (tools/ota/keys.sh); this workflow only reads it and never creates it (the first CI job that needs
# the key does, serialised by its own concurrency group).
on:
  push:
    branches-ignore: ['promote/**', 'release/**']

env:
  GODOT_VERSION: "4.6"
  GODOT_RELEASE: "4.6-stable"

permissions:
  contents: read

jobs:
  ota-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ota-validate-${{ github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/ota/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0               # tags + history for the classification against the latest native tag

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-windows-templates-v1

      - name: Install Godot ${{ env.GODOT_RELEASE }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -O "${base}/SHA512-SUMS.txt"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          grep -E "Godot_v${GODOT_RELEASE}_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" 'templates/windows_*' 'templates/version.txt' -d tmp
          mv tmp/templates/* "$tpl"/
          rm -rf tmp *.zip *.tpz

      - name: Locate Godot
        run: echo "GODOT=$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify Godot version
        run: |
          "$GODOT" --version
          "$GODOT" --version | grep -q "^${GODOT_VERSION}.stable"

      - name: OTA unit tests (python tools + the OTA part of the headless suite)
        # run_tests.sh always runs tests/test_ota_tools.py (stdlib python + openssl + this Godot) and, with
        # TEST_FILTER=ota, only the test scenes whose name contains "ota" (tests/test_ota_*.tscn).
        env:
          TEST_FILTER: ota
        run: tests/run_tests.sh "$GODOT"

      - name: End-to-end device simulation (real build chain + real packaged game, Windows pack, throwaway key)
        # Builds a real update with tools/ota/build_ota.sh --self-test (HEAD as its own base), serves the channel over
        # local HTTP and drives the packaged game through download -> restart -> confirm, crash-loop rollback, corrupt /
        # tampered / unreachable channel, wrong platform, --no-ota, revocation, replay and save protection.
        run: python3 tests/ota_e2e.py "$GODOT" --platform windows

      - name: Self-test the whole chain, Android (same import settings as tools/android/build_apk.sh)
        # `--export-pack` / `--export-patch` need neither the Android SDK nor the export templates (verified locally).
        run: tools/ota/build_ota.sh --platform android --self-test --godot "$GODOT" --out build/ota-selftest/android

      - name: Classification against the latest native tag (informational)
        run: |
          set +e
          tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          {
            echo "### OTA classification of this commit"
            if [[ -z "$tag" ]]; then
              echo "No native tag (v<N>) exists in this clone."
            else
              echo "Against the latest native build \`$tag\`:"
              echo '```'
              python3 tools/ota/classify.py "$tag" HEAD
              echo "exit status: $?"
              echo '```'
              echo "(0 = OTA-safe, 10 = APK required, 11 = guarded save/settings code touched. Informational only.)"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload self-test bundle (engineering only, signed with a throwaway key, never publishable)
        uses: actions/upload-artifact@v4
        with:
          name: ota-selftest-bundle-${{ github.sha }}
          path: build/ota-selftest
          retention-days: 3
          compression-level: 6

  # Explicit publish action: push a branch  ota/v<N>/<K>.  Builds the real bundle for the native build of tag v<N>.
  ota-publish:
    needs: ota-validate
    if: ${{ startsWith(github.ref, 'refs/heads/ota/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: ota-channel                 # one publication at a time: channel.json generation must be linear
      cancel-in-progress: false
    permissions:
      # contents:write only because a token with contents:read cannot list the private DRAFT release that stores the
      # signing key. This job never creates or edits releases (OTA_KEYS_NO_CREATE=1 below; a test forbids every
      # release-writing gh command in this file). Pushing to the channel repo uses OTA_PUBLISH_TOKEN.
      contents: write
    env:
      OTA_CHANNEL_REPO: ${{ vars.OTA_CHANNEL_REPO || secrets.OTA_CHANNEL_REPO }}
      OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse and validate the branch name (ota/v<N>/<K>)
        id: p
        run: |
          set -euo pipefail
          IFS=/ read -r prefix ver seq extra <<<"$GITHUB_REF_NAME"
          [[ "$prefix" == "ota" && "$ver" =~ ^v[1-9][0-9]*$ && "$seq" =~ ^[1-9][0-9]*$ && -z "$extra" ]] \
            || { echo "branch must be named ota/v<N>/<K> (got $GITHUB_REF_NAME)"; exit 1; }
          git rev-parse --verify --quiet "refs/tags/${ver}^{commit}" >/dev/null \
            || { echo "native tag $ver does not exist: an OTA is built against the native build of an existing vN"; exit 1; }
          tagver="$(git show "refs/tags/${ver}:VERSION" | tr -d '[:space:]')"
          [[ "$tagver" == "${ver#v}" ]] || { echo "tag $ver has VERSION $tagver"; exit 1; }
          git merge-base --is-ancestor "refs/tags/${ver}^{commit}" HEAD \
            || { echo "HEAD does not descend from $ver; an update must be built on top of its native build"; exit 1; }
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "seq=$seq" >> "$GITHUB_OUTPUT"

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-ota-templates-v1

      - name: Install Godot ${{ env.GODOT_RELEASE }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -O "${base}/SHA512-SUMS.txt"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          grep -E "Godot_v${GODOT_RELEASE}_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" 'templates/windows_*' 'templates/android_*' 'templates/version.txt' -d tmp
          mv tmp/templates/* "$tpl"/
          rm -rf tmp *.zip *.tpz

      - name: Locate Godot
        run: echo "GODOT=$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify Godot version
        run: |
          "$GODOT" --version
          "$GODOT" --version | grep -q "^${GODOT_VERSION}.stable"

      - name: OTA signing key (read only - never created by this job)
        env:
          GH_TOKEN: ${{ github.token }}
          OTA_SIGNING_KEY_PEM_BASE64: ${{ secrets.OTA_SIGNING_KEY_PEM_BASE64 }}
          OTA_KEYS_NO_CREATE: "1"
        run: source tools/ota/keys.sh "$RUNNER_TEMP/ota_trust.pem"

      - name: Fetch the shipped native builds of ${{ steps.p.outputs.ver }} (read only)
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.p.outputs.ver }}
        run: |
          set -euo pipefail
          mkdir -p native
          gh release download "$VER" --repo "$GITHUB_REPOSITORY" --dir native \
            --pattern "Purgatory-Dungeon-${VER}-Windows.zip" --pattern "Purgatory-Dungeon-${VER}.apk"
          ls -l native
          test -s "native/Purgatory-Dungeon-${VER}-Windows.zip" && test -s "native/Purgatory-Dungeon-${VER}.apk"

      - name: Check out the current channel (continues generation and update numbers)
        if: env.OTA_CHANNEL_REPO != '' && env.OTA_PUBLISH_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OTA_CHANNEL_REPO }}
          token: ${{ secrets.OTA_PUBLISH_TOKEN }}
          path: channel-repo

      - name: Seed the working channel directory
        run: |
          set -euo pipefail
          mkdir -p build/ota
          if [[ -d channel-repo ]]; then
            cp -a channel-repo/. build/ota/
            rm -rf build/ota/.git
            echo "continuing the channel at generation $(python3 -c "import json;print(json.load(open('build/ota/channel.json'))['generation'])" 2>/dev/null || echo none)"
          else
            echo "no channel repository configured: building into an empty channel directory (dry run)"
          fi

      - name: Build and verify the update for both platforms
        env:
          VER: ${{ steps.p.outputs.ver }}
          SEQ: ${{ steps.p.outputs.seq }}
          # fail = base.pck must equal the shipped build file for file. Set the repository variable OTA_NATIVE_CHECK to
          # warn only while the Android asset layout is being qualified (docs/OTA.md).
          NATIVE_CHECK: ${{ vars.OTA_NATIVE_CHECK || 'fail' }}
        run: |
          set -euo pipefail
          tools/ota/build_ota.sh --platform windows --base-ref "$VER" --godot "$GODOT" --seq "$SEQ" \
            --native-artifact "native/Purgatory-Dungeon-${VER}-Windows.zip" --native-check "$NATIVE_CHECK" \
            --out build/ota --no-channel
          tools/ota/build_ota.sh --platform android --base-ref "$VER" --godot "$GODOT" --seq "$SEQ" \
            --native-artifact "native/Purgatory-Dungeon-${VER}.apk" --native-check "$NATIVE_CHECK" \
            --out build/ota --no-channel

      - name: Merge channel.json and verify the whole channel
        run: |
          set -euo pipefail
          prev=()
          [[ -f channel-repo/channel.json ]] && prev=(--previous-channel channel-repo/channel.json)
          python3 tools/ota/channel.py merge --out build/ota --key "$OTA_PRIVATE_KEY_PATH"
          python3 tools/ota/verify_bundle.py build/ota --pubkey "$RUNNER_TEMP/ota_trust.pem" "${prev[@]}"

      - name: Upload the bundle (engineering artifact; the channel is only written by the next step when configured)
        uses: actions/upload-artifact@v4
        with:
          name: ota-bundle-${{ steps.p.outputs.ver }}-update-${{ steps.p.outputs.seq }}-${{ github.sha }}
          path: |
            build/ota/channel.json
            build/ota/channel.json.sig
            build/ota/${{ steps.p.outputs.ver }}/*/update-${{ steps.p.outputs.seq }}/
          retention-days: 14
          compression-level: 0

      - name: Publish to the channel repository
        if: env.OTA_CHANNEL_REPO != '' && env.OTA_PUBLISH_TOKEN != ''
        env:
          VER: ${{ steps.p.outputs.ver }}
          SEQ: ${{ steps.p.outputs.seq }}
        run: |
          set -euo pipefail
          # only the channel index and update folders are written; payload folders first in the same commit
          cp -a build/ota/. channel-repo/
          git -C channel-repo config user.name "Hot Attic Games OTA"
          git -C channel-repo config user.email "ota@users.noreply.github.com"
          git -C channel-repo add -A
          if git -C channel-repo diff --cached --quiet; then echo "channel already up to date"; exit 0; fi
          git -C channel-repo commit -q -m "Purgatory Dungeon ${VER} update ${SEQ}"
          git -C channel-repo push        # fast-forward only, no force, no tags
          {
            echo "### OTA published"
            echo "Purgatory Dungeon ${VER} update ${SEQ} was pushed to the channel repository \`${OTA_CHANNEL_REPO}\`."
            echo "channel.json generation: $(python3 -c "import json;print(json.load(open('channel-repo/channel.json'))['generation'])")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary - publication is not configured (dry run)
        if: env.OTA_CHANNEL_REPO == '' || env.OTA_PUBLISH_TOKEN == ''
        run: |
          {
            echo "### OTA dry run - NOTHING WAS PUBLISHED"
            echo "Publication is **not configured**: the repository variable/secret \`OTA_CHANNEL_REPO\` and the secret \`OTA_PUBLISH_TOKEN\` must both exist (owner authorization)."
            echo "The signed, verified bundle for **${{ steps.p.outputs.ver }} update ${{ steps.p.outputs.seq }}** (windows + android) is attached to this run as the artifact \`ota-bundle-*\` (channel.json generation $(python3 -c "import json;print(json.load(open('build/ota/channel.json'))['generation'])"))."
            echo "No GitHub Release, tag or \"Latest\" marker was created or changed."
          } | tee -a "$GITHUB_STEP_SUMMARY"
