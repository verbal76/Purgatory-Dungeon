name: OTA tests (reusable)

# The release gate for an OTA (docs/OTA.md section 11): the FULL headless suite, tests/run_tests.sh, on one exact commit.
# Called by ota-publish.yml with the pinned SHA; it is a workflow_call only, so nothing can start it on its own.
# Read-only: it never publishes, tags or writes anything.
#
# COST (docs/RELEASES.md "CI cost"): ota-publish.yml only calls this workflow when it cannot VERIFY (tools/ota/proven_suite.py, through the
# GitHub API) that the same suite already passed on the same commit. The last step below is the attestation that makes THIS run a source
# such a later publication may reuse: it runs only after the suite passed, and only when the tested tree is the tree of the pinned commit.
# Its name is a constant of proven_suite.py (tests/test_ota_tools.py keeps them equal).
on:
  workflow_call:
    inputs:
      ref:
        description: Full 40-hex commit SHA to test
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  suite:
    name: Full test suite on the exact SHA
    runs-on: ubuntu-latest
    timeout-minutes: 45   # typical: 15-19 minutes; every Godot stage also has its own `timeout`
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false   # the suite runs repository code: no token stays in .git/config

      - name: Exact commit
        env:
          WANT: ${{ inputs.ref }}
        run: |
          [[ "$WANT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ref must be a full 40-hex commit SHA (got '$WANT')"; exit 1; }
          test "$(git rev-parse HEAD)" = "$WANT" || { echo "::error::checked out $(git rev-parse HEAD), not $WANT"; exit 1; }

      - name: Engine version of the runtime (ci.yml GODOT_RELEASE via ota/boundary.json)
        id: engine
        run: |
          ver="$(python3 tools/ota_runtime.py --engine)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "release=${ver}-stable" >> "$GITHUB_OUTPUT"

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ steps.engine.outputs.release }}-windows-templates-v1

      - name: Install Godot ${{ steps.engine.outputs.release }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          GODOT_RELEASE: ${{ steps.engine.outputs.release }}
          GODOT_VERSION: ${{ steps.engine.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -O "${base}/SHA512-SUMS.txt"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          grep -E "Godot_v${GODOT_RELEASE}_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" 'templates/windows_*' 'templates/version.txt' -d tmp
          mv tmp/templates/* "$tpl"/
          rm -rf tmp *.zip *.tpz

      - name: Locate Godot
        env:
          GODOT_RELEASE: ${{ steps.engine.outputs.release }}
        run: echo "GODOT=$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify Godot version
        env:
          GODOT_VERSION: ${{ steps.engine.outputs.version }}
        run: |
          "$GODOT" --version
          "$GODOT" --version | grep -q "^${GODOT_VERSION}.stable"

      - name: Full suite (tests/run_tests.sh)
        run: tests/run_tests.sh "$GODOT"

      - name: Exact-tree check (is the tested tree the tree of the pinned commit?)
        id: exacttree
        env:
          WANT: ${{ inputs.ref }}
        run: |
          same=false
          if python3 tools/ota/proven_suite.py same-tree --sha "$WANT"; then same=true; fi
          echo "same=$same" >> "$GITHUB_OUTPUT"

      - name: Exact-SHA attestation (the suite above passed on the tree of the commit)
        if: steps.exacttree.outputs.same == 'true'
        env:
          WANT: ${{ inputs.ref }}
        run: echo "the full suite passed on the exact tree of commit $WANT"
