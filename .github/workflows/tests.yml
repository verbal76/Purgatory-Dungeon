name: Tests

# Validation only: the headless suite on pushes to main and on pull requests that are READY FOR REVIEW. This workflow builds nothing, signs nothing,
# tags nothing and publishes nothing; it has a read-only token. Building and publishing are separate operations: the manual workflow in ci.yml.
# ACTIONS BUDGET POLICY (CLAUDE.md "GitHub Actions budget"): drafts never run, docs-only changes never run, a newer commit cancels the superseded run.
# The "Validate project and run tests" and "Exact-SHA attestation" steps are what tools/ota/proven_suite.py lets an OTA publication reuse (docs/OTA.md 11a).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', '.gitignore', '.editorconfig', '.gitattributes']

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep equal to ci.yml (tests/test_build_workflow.py): the engine pin is part of the native runtime lock.
  GODOT_VERSION: "4.6"
  GODOT_RELEASE: "4.6-stable"
  # On pull_request events github.sha is a synthetic merge commit that exists on no branch; record the real head commit.
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  validate:
    # Draft pull requests never run.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45   # typical: 15-17 minutes
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_RELEASE }}-editor-v1

      - name: Install Godot ${{ env.GODOT_RELEASE }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -O "${base}/SHA512-SUMS.txt"
          curl -fsSL -O "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          grep -E "Godot_v${GODOT_RELEASE}_linux.x86_64.zip$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          rm -f *.zip

      - name: Locate Godot
        run: echo "GODOT=$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify Godot version
        run: |
          "$GODOT" --version
          "$GODOT" --version | grep -q "^${GODOT_VERSION}.stable"

      - name: Check public version consistency
        run: python3 tools/release_tool.py check

      - name: Native runtime lock (docs/OTA.md section 3)
        run: python3 tools/ota_runtime.py --check

      - name: Validate project and run tests
        env:
          # OPT-IN (docs/RELEASES.md "CI cost", owner decision): the repository variable CI_TEST_JOBS (e.g. 3) runs that many Godot stages at once
          # on the 4-vCPU runner. Unset/empty = strictly sequential.
          TEST_JOBS: ${{ vars.CI_TEST_JOBS }}
        run: tests/run_tests.sh "$GODOT"

      # What lets a later OTA publication REUSE this green suite instead of re-running it (tools/ota/proven_suite.py, docs/OTA.md 11a).
      # A pull_request run tests a synthetic merge commit, so the suite result only speaks for SOURCE_SHA when the tested tree IS the tree of
      # SOURCE_SHA; the attestation step runs (and so shows success through the API) only then.
      - name: Exact-tree check (is the tested tree the tree of the commit named SOURCE_SHA?)
        id: exacttree
        run: |
          same=false
          if python3 tools/ota/proven_suite.py same-tree --sha "$SOURCE_SHA"; then same=true; fi
          echo "same=$same" >> "$GITHUB_OUTPUT"

      - name: Exact-SHA attestation (the suite above passed on the tree of the commit)
        if: steps.exacttree.outputs.same == 'true'
        run: echo "the full suite passed on the exact tree of commit $SOURCE_SHA"
